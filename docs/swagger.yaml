basePath: /api/v1
definitions:
  models.Item:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        minimum: 0
        type: number
      stock:
        minimum: 0
        type: integer
      updated_at:
        type: string
    required:
    - name
    - price
    - stock
    type: object
  utilities.HTTPError:
    properties:
      code:
        example: 400
        type: integer
      message:
        example: Invalid input
        type: string
    type: object
  utilities.MessageResponse:
    properties:
      message:
        example: Item deleted
        type: string
    type: object
  utilities.PaginatedItemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Item'
        type: array
      meta:
        $ref: '#/definitions/utilities.PaginationMetaData'
    type: object
  utilities.PaginationMetaData:
    properties:
      limit:
        type: integer
      offset:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: This a backend API for an inventory management system
  title: Inventory Management API
  version: "1.0"
paths:
  /inventory:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated, filterable, sortable list of inventory items
      parameters:
      - description: Comma-separated fields to sort by (name, stock, price, created_at)
        in: query
        name: sort
        type: string
      - description: 'Comma-separated sort directions matching `sort`: asc or desc'
        in: query
        name: order
        type: string
      - description: Filter items by exact name match
        in: query
        name: name
        type: string
      - description: Filter items with stock greater than or equal to this value
        in: query
        name: min_stock
        type: integer
      - description: Max number of items to return (default 20)
        in: query
        name: limit
        type: integer
      - description: Number of items to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utilities.PaginatedItemsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utilities.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utilities.HTTPError'
      summary: List inventory items
      tags:
      - inventory
    post:
      consumes:
      - application/json
      description: Creates a new inventory item from the request body
      parameters:
      - description: Item to create
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/models.Item'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Item'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utilities.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utilities.HTTPError'
      summary: Create an inventory item
      tags:
      - inventory
  /inventory/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes an existing inventory item by its UUID
      parameters:
      - description: Item ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utilities.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utilities.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utilities.HTTPError'
      summary: Delete an inventory item
      tags:
      - inventory
    get:
      consumes:
      - application/json
      description: Retrieves the details of a single inventory item by its UUID
      parameters:
      - description: Item ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Item'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utilities.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utilities.HTTPError'
      summary: Get an inventory item
      tags:
      - inventory
    put:
      consumes:
      - application/json
      description: Updates an existing inventory item with the fields provided in
        the request body
      parameters:
      - description: Item ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/models.Item'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Item'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utilities.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utilities.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utilities.HTTPError'
      summary: Update an inventory item
      tags:
      - inventory
swagger: "2.0"
